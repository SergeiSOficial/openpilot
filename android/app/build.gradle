plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'ai.comma.openpilot.sim'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId project.hasProperty('liveShadow') ? 'com.samsung.android.openpilot.shadow' : 'ai.comma.openpilot.sim'
        manifestPlaceholders = [appLabel: project.hasProperty('liveShadow') ? 'openpilot Live Shadow' : 'openpilot Simulation']
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName project.hasProperty('liveShadow') ? '0.2.0-live-shadow' : '0.1.0-simulation'
        ndk {
            if (project.hasProperty('liveShadow')) { abiFilters 'arm64-v8a' }
            else { abiFilters 'x86_64', 'arm64-v8a' }
        }
        if (!project.hasProperty('prebuiltNative')) {
            externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { aidl true; buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
    splits {
        abi {
            enable true
            reset()
            if (project.hasProperty('liveShadow')) { include 'arm64-v8a' }
            else { include 'x86_64', 'arm64-v8a' }
            universalApk true
        }
    }
    if (!project.hasProperty('prebuiltNative')) {
        externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { python.srcDirs = ['src/main/python', '../../tools/android/.cache/python'] } }
    buildTypes { debug { debuggable true; jniDebuggable true } }
}

chaquopy {
    defaultConfig {
        version '3.12'
        if (project.hasProperty('buildPython')) { buildPython project.property('buildPython') }
        if (project.hasProperty('withModel')) {
            extractPackages 'tinygrad', 'openpilot_android_vendor', 'numpy', 'capnp', 'openpilot', 'opendbc', 'rednose'
            pip {
                options '--no-index', '--find-links', file('../../tools/android/.cache/wheels').absolutePath
                install 'numpy==2.5.3'
                install 'pycapnp==2.1.0'
                install 'msgq==0.0.1'
                install 'cffi==2.1.1'
                install 'setproctitle==1.3.7'
                install 'rednose==0.0.1'
                install 'zstandard==0.25.0'
                install 'pycryptodome==3.23.0'
                install '-r', file('../../tools/android/.cache/runtime-requirements.txt').absolutePath
            }
        }
    }
}

dependencies {
    if (project.hasProperty('liveShadow')) {
        implementation files('../../tools/android/.cache/live-deps/onnxruntime-android-1.23.2.aar')
    }
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

if (project.hasProperty('withModel')) {
    tasks.register('verifySimulationBundle', Exec) {
        commandLine project.findProperty('buildPython') ?: 'python3',
            file('../../tools/android/validate_bundle.py').absolutePath
    }
    tasks.named('preBuild').configure { dependsOn 'verifySimulationBundle' }
    if (project.hasProperty('liveShadow')) {
        tasks.register('verifyLiveBundle', Exec) {
            commandLine project.findProperty('buildPython') ?: 'python3', file('../../tools/android/validate_live_bundle.py').absolutePath
        }
        tasks.named('preBuild').configure { dependsOn 'verifyLiveBundle' }
    }
}
